name: Release Native Steam Deck & Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        continue-on-error: true

      - name: Verify repository content boundaries
        run: |
          python3 tools/check_content.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build make libopus-dev libvpx-dev libzstd-dev libvulkan-dev glslc spirv-tools

      - name: Package Release
        run: |
          VERSION="${GITHUB_REF_NAME:-continuous}"
          PACKAGE_NAME="NX2navi-SteamDeck-Linux-${VERSION}"
          mkdir -p "dist/${PACKAGE_NAME}"
          cp -r runtime recomp docs tools LICENSE LICENSE-ADDITIONS THIRD_PARTY_NOTICES.md README.md nx2navi.ini.example "dist/${PACKAGE_NAME}/"
          cd dist
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "NX2navi Steam Deck Native Optimization ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
          generate_release_notes: true
